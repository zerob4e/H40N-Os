<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NØAH OS // NODE-07</title>
<link rel="icon" href="./favicon.svg">
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#181919;
  color:#e5e5e5;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 38%,rgba(255,255,255,.028),transparent 38%),
    linear-gradient(180deg,#202121 0%,#191a1a 100%);
}
.login-shell{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  padding:38px;
}
.login{
  width:min(455px,calc(100vw - 48px));
  text-align:center;
}
.os-brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  margin-bottom:46px;
  font-size:14px;
  font-weight:800;
  letter-spacing:-.015em;
  color:#d4d5d4;
}
.os-brand span{
  font-size:11px;
  font-weight:500;
  color:#707371;
  letter-spacing:.02em;
}
.avatar{
  width:160px;
  height:160px;
  margin:0 auto 24px;
  display:grid;
  place-items:center;
  border:1px solid #4c4f4d;
  border-radius:50%;
  background:rgba(255,255,255,.016);
  box-shadow:0 22px 58px rgba(0,0,0,.18);
}

.profile-image{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  object-position:56% 30%;
  display:block;
}

.echo .profile-image{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  object-position:56% 30%;
}
.name{
  margin:0;
  font-size:36px;
  line-height:1.08;
  font-weight:650;
  letter-spacing:-.028em;
}
.session-copy{
  margin:14px 0 38px;
  color:#858886;
  font-size:13px;
  font-weight:500;
}
.password-label{
  display:block;
  text-align:left;
  margin:0 0 8px 2px;
  color:#9b9d9c;
  font-size:12px;
  font-weight:600;
}
.password-row{
  display:grid;
  grid-template-columns:1fr 88px;
  height:52px;
}
.password-wrap{position:relative}
.password-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:22px;
  height:22px;
  opacity:.68;
  pointer-events:none;
}
.password-icon img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
}
input{
  width:100%;
  height:52px;
  border:1px solid #4c4f4d;
  border-right:0;
  border-radius:10px 0 0 10px;
  outline:none;
  background:#222323;
  color:#eee;
  padding:0 16px 0 55px;
  font-size:16px;
  letter-spacing:.065em;
}
input:focus{border-color:#777c79;background:#252626}
.login-btn{
  height:52px;
  border:1px solid #c3c5c3;
  border-radius:0 10px 10px 0;
  background:#e0e1e0;
  color:#181919;
  font-size:11px;
  font-weight:750;
  cursor:pointer;
}
.login-btn:hover:not(:disabled){background:#efefef}
.login-btn:disabled{opacity:.55;cursor:wait}
.hint-row{
  min-height:54px;
  padding:10px 2px 0;
  text-align:left;
}
.hint{color:#747775;font-size:11px;line-height:1.4}
.status{
  margin-top:7px;
  min-height:13px;
  color:#747775;
  font:700 9px ui-monospace,Consolas,monospace;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.status.good{color:#91a397}
.status.bad{color:#b37b84}
.switch-user{
  margin-top:7px;
  border:0;
  background:none;
  padding:7px 0;
  color:#787b79;
  font-size:11px;
  cursor:pointer;
}
.switch-user:hover{color:#c4c6c4}
.footer{
  margin-top:39px;
  padding-top:17px;
  border-top:1px solid #363837;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#666967;
  font-size:10px;
}
.echo .avatar{
  border-color:#5b464c;
  box-shadow:0 22px 60px rgba(53,12,21,.09);
}

.echo .name{letter-spacing:.065em;font-size:32px}
.echo .session-copy{color:#806f73}
.echo .status.good{color:#9a858a}

@media(max-height:760px){
  .login{width:min(420px,calc(100vw - 42px))}
  .os-brand{margin-bottom:31px;font-size:13px}
  .avatar{width:112px;height:112px;margin-bottom:18px}
  .echo .profile-image{padding:26px}
  .name{font-size:32px}
  .session-copy{margin:11px 0 29px;font-size:12px}
  .password-row{height:48px}
  input,.login-btn{height:48px}
  .footer{margin-top:27px}
}
@media(max-width:520px){
  .login-shell{padding:22px}
  .login{width:100%}
}
</style>
</head>
<body>
<main class="login-shell">
  <section class="login" id="loginPanel">
    <div class="os-brand">NØAH OS <span>NODE-07</span></div>

    <div class="avatar" aria-hidden="true">
      <img
        id="profileImage"
        class="profile-image"
        src="./noah-avatar.png"
        alt=""
      >
    </div>

    <h1 class="name" id="displayName">Noah</h1>
    <div class="session-copy" id="sessionCopy">Local session · NØAH OS 7.4.19</div>

    <form id="loginForm" autocomplete="off">
      <label class="password-label" for="password">Password</label>
      <div class="password-row">
        <div class="password-wrap">
          <span class="password-icon" aria-hidden="true">
            <img src="./login-key.svg" alt="">
          </span>
          <input id="password" type="password" autocomplete="current-password" autofocus>
        </div>
        <button class="login-btn" id="login" type="submit">Log in</button>
      </div>

      <div class="hint-row">
        <div class="hint">Press Enter to unlock</div>
        <div class="status" id="status"></div>
      </div>
    </form>

    <button class="switch-user" id="switchUser" type="button">Switch user</button>

    <div class="footer">
      <span id="networkText">Network: off-grid</span>
      <span id="systemText">E.C.H.O.: isolated</span>
    </div>
  </section>
</main>

<script>

(() => {
  "use strict";

  if (location.protocol === "file:") {
    const status = document.getElementById("status");
    status.textContent = "LOCAL NODE OFFLINE";
    status.className = "status bad";
    document.getElementById("login").disabled = true;
    return;
  }

  const API_KEY = "AIzaSyBF2SS3AannotAsRR8s4wFDlKZfdWnlaNU";
  const EMAILS = {
    noah: "noah-access@h40n-terminal.app",
    echo: "operator@h40n-terminal.app"
  };

  let role = "noah";

  const $ = id => document.getElementById(id);

  function readSession() {
    try {
      const data = JSON.parse(sessionStorage.getItem("noah.session") || "null");
      if (!data || !["noah","echo"].includes(data.role)) return null;
      if (!data.idToken || Number(data.expiresAt) <= Date.now() + 5000) return null;
      return data;
    } catch {
      return null;
    }
  }

  if (readSession()) {
    location.replace("./os.html");
    return;
  }

  function setRole(next) {
    role = next;
    const panel = $("loginPanel");
    const echo = role === "echo";

    panel.classList.toggle("echo", echo);
    $("displayName").textContent = echo ? "E.C.H.O." : "Noah";
    $("profileImage").src = echo ? "./echo-avatar.jpg" : "./noah-avatar.jpg";
    $("sessionCopy").textContent = echo
      ? "Internal session · E.C.H.O. process"
      : "Local session · NØAH OS 7.4.19";
    $("networkText").textContent = echo ? "Network: neural relay" : "Network: off-grid";
    $("systemText").textContent = echo ? "Host: N.ROOT" : "E.C.H.O.: isolated";
    $("status").textContent = "";
    $("status").className = "status";
    $("password").value = "";
    $("password").focus();
  }

  async function authenticate(password) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 18000);

    try {
      if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
        const response = await fetch("/api/auth-login", {
          method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({role,password}),
          signal:controller.signal
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP_${response.status}`);
        return data;
      }

      const response = await fetch(
        `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(API_KEY)}`,
        {
          method:"POST",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({
            email:EMAILS[role],
            password,
            returnSecureToken:true
          }),
          signal:controller.signal
        }
      );

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data?.error?.message || `HTTP_${response.status}`);
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  function friendly(error) {
    const code = String(error?.message || "");
    if (error?.name === "AbortError") return "AUTH ROUTE TIMEOUT";
    if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(code)) return "INVALID SIGNATURE";
    if (/TOO_MANY_ATTEMPTS/.test(code)) return "ACCESS TEMPORARILY LOCKED";
    if (/USER_DISABLED/.test(code)) return "ACCOUNT DISABLED";
    if (/OPERATION_NOT_ALLOWED/.test(code)) return "EMAIL/PASSWORD AUTH DISABLED";
    if (/NETWORK|REQUEST_FAILED|Failed to fetch/i.test(code)) return "AUTH NETWORK UNAVAILABLE";
    return code || "AUTHENTICATION FAILED";
  }

  $("switchUser").addEventListener("click", () => {
    setRole(role === "noah" ? "echo" : "noah");
  });

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const password = $("password").value;
    if (!password) return;

    $("login").disabled = true;
    $("password").disabled = true;
    $("status").textContent = "VERIFYING";
    $("status").className = "status";

    try {
      const data = await authenticate(password);
      const expiresIn = Math.max(60, Number(data.expiresIn || 3600));

      sessionStorage.setItem("noah.session", JSON.stringify({
        role,
        idToken:data.idToken,
        expiresAt:Date.now() + expiresIn * 1000
      }));

      $("password").value = "";
      $("status").textContent = "SIGNATURE ACCEPTED";
      $("status").className = "status good";

      setTimeout(() => location.replace("./os.html"), 170);
    } catch (error) {
      $("status").textContent = friendly(error);
      $("status").className = "status bad";
      $("password").value = "";
      $("password").disabled = false;
      $("login").disabled = false;
      $("password").focus();
    }
  });

  setRole("noah");
})();

</script>
</body>
</html>
